<ion-header>
  <ion-toolbar>
    <ion-title>Verify OTP</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <p>OTP sent to <b>{{ mobile }}</b></p>

  <ion-item>
    <ion-input
      type="number"
      maxlength="6"
      placeholder="Enter OTP"
      [(ngModel)]="otp">
    </ion-input>
  </ion-item>

  <ion-button
    expand="block"
    class="ion-margin-top"
    (click)="verifyOtp()">
    VERIFY
  </ion-button>

</ion-content>
