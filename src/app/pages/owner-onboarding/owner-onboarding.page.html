<ion-header>
  <ion-toolbar>
    <ion-title>Shop Registration</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- 🏪 BASIC INFO -->
  <div class="section-card">
    <h3>🏪 Shop Details</h3>

    <ion-item>
      <ion-input placeholder="Owner Name" [(ngModel)]="form.ownerName"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input placeholder="Shop Name" [(ngModel)]="form.shopName"></ion-input>
    </ion-item>
  </div>

  <!-- 📞 CONTACT -->
  <div class="section-card">
    <h3>📞 Contact</h3>

    <ion-item>
      <ion-input
        #mobileInput
        placeholder="Mobile Number"
        [(ngModel)]="form.mobile"
        [readonly]="!isEditingMobile">
      </ion-input>
      <ion-icon
        name="create-outline"
        slot="end"
        (click)="enableMobileEdit()">
      </ion-icon>
    </ion-item>

    <ion-item>
      <ion-input placeholder="Email (optional)" [(ngModel)]="form.email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-textarea placeholder="Address" [(ngModel)]="form.address"></ion-textarea>
    </ion-item>
  </div>

  <!-- 📍 LOCATION -->
  <div class="section-card highlight">
    <h3>📍 Shop Location *</h3>

    <ion-button expand="block" (click)="getCurrentLocation()">
      Use Current Location
    </ion-button>

    <div *ngIf="latitude">
      ✔️ {{ latitude }}, {{ longitude }}
    </div>
  </div>

  <!-- 🚗 VEHICLE TYPE -->
  <div class="section-card">
    <h3>🚗 Vehicle Type</h3>

    <ion-item>
      <ion-select [(ngModel)]="form.vehicleType">
        <ion-select-option value="BIKE">Bike</ion-select-option>
        <ion-select-option value="CAR">Car</ion-select-option>
        <ion-select-option value="BOTH">Both</ion-select-option>
      </ion-select>
    </ion-item>
  </div>

  <!-- 🏪 SHOP TYPE -->
  <div class="section-card">
    <h3>🏪 Shop Type</h3>

    <ion-item>
      <ion-select [(ngModel)]="form.shopType">
        <ion-select-option value="MECHANIC">Mechanic</ion-select-option>
        <ion-select-option value="PUNCHER">Puncher</ion-select-option>
        <ion-select-option value="BOTH">Both</ion-select-option>
      </ion-select>
    </ion-item>
  </div>

  <!-- 🔧 SERVICES (ONLY IF NOT MECHANIC) -->
  <div class="section-card" *ngIf="form.shopType !== 'MECHANIC'">
    <h3>🛠 Services Offered</h3>

    <ion-item lines="none">
      <ion-checkbox [(ngModel)]="form.tube"></ion-checkbox>
      <ion-label>Tube Puncture</ion-label>
    </ion-item>

    <ion-item lines="none">
      <ion-checkbox [(ngModel)]="form.tubeless"></ion-checkbox>
      <ion-label>Tubeless Puncture</ion-label>
    </ion-item>

    <ion-item lines="none">
      <ion-checkbox [(ngModel)]="form.air"></ion-checkbox>
      <ion-label>Air Fill</ion-label>
    </ion-item>
  </div>

  <!-- ✅ SUBMIT -->
  <ion-button expand="block" size="large" (click)="submit()">
    Submit Details
  </ion-button>

</ion-content>
