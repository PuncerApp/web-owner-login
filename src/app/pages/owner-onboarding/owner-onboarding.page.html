<ion-header>
  <ion-toolbar>
    <ion-title>Shop Registration</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- 🏪 BASIC INFO -->
  <div class="section-card">
    <h3>🏪 Shop Details*</h3>

    <ion-item>
      <ion-input placeholder="Owner Name" [(ngModel)]="form.ownerName"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input placeholder="Shop Name" [(ngModel)]="form.shopName"></ion-input>
    </ion-item>
  </div>

  <!-- 📞 CONTACT -->
  <div class="section-card">
    <h3>📞 Contact</h3>

    <ion-item>
      <ion-input
        #mobileInput
        placeholder="Mobile Number"
        [(ngModel)]="form.mobile"
        [readonly]="!isEditingMobile">
      </ion-input>
      <ion-icon
        name="create-outline"
        slot="end"
        class="edit-icon"
        (click)="enableMobileEdit()">
      </ion-icon>
    </ion-item>

    <ion-item>
      <ion-input type="email" placeholder="Email (optional)" [(ngModel)]="form.email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-textarea placeholder="Shop Address" [(ngModel)]="form.address"></ion-textarea>
    </ion-item>
  </div>

  <!-- 📍 LOCATION -->
  <div class="section-card highlight">
    <h3>📍 Shop Location <span class="required">*</span></h3>

    <ion-button
      expand="block"
      color="primary"
      (click)="getCurrentLocation()"
      [disabled]="locationLoading">

      <ion-spinner *ngIf="locationLoading" name="dots"></ion-spinner>
      <span *ngIf="!locationLoading">Use Current Location</span>
    </ion-button>

    <div *ngIf="latitude" class="location-success">
      ✔️ Location captured  
      <div class="coords">
        {{ latitude }}, {{ longitude }}
      </div>
    </div>
  </div>

  <!-- 🚲 SERVICES -->
  <div class="section-card">
    <h3>🛠 Services Offered</h3>

    <ion-item>
      <ion-label>Vehicle Type</ion-label>
      <ion-select [(ngModel)]="form.vehicleType">
        <ion-select-option value="Bike">Bike</ion-select-option>
        <ion-select-option value="Car">Car</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item lines="none">
      <ion-checkbox slot="start" [(ngModel)]="form.tube"></ion-checkbox>
      <ion-label>Tube Puncture</ion-label>
    </ion-item>

    <ion-item lines="none">
      <ion-checkbox slot="start" [(ngModel)]="form.tubeless"></ion-checkbox>
      <ion-label>Tubeless Puncture</ion-label>
    </ion-item>

    <ion-item lines="none">
      <ion-checkbox slot="start" [(ngModel)]="form.air"></ion-checkbox>
      <ion-label>Air Fill</ion-label>
    </ion-item>
  </div>

  <!-- ✅ SUBMIT -->
  <ion-button
    expand="block"
    size="large"
    class="submit-btn"
    (click)="submit()"
    [disabled]="!latitude || !longitude">

    Submit Details
  </ion-button>

</ion-content>
